[package]
name = "goodsorcery"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Philip Q Nguyen"]
license = "MIT"
description = "Error tracking and performance monitoring for Rust apps, reporting to Good Sorcery"
repository = "https://github.com/creativesorcery/goodsorcery-rust"
readme = "README.md"
keywords = ["error-tracking", "apm", "panic", "monitoring", "axum"]
categories = ["development-tools::debugging", "development-tools::profiling", "web-programming"]
# Private crate: never published to crates.io.
publish = false

[features]
default = ["axum", "performance", "tracing"]
# The tower/axum layer: request context, panics, 5xx responses and request timing.
axum = ["dep:axum", "dep:http", "dep:tower-layer", "dep:tower-service"]
# Performance monitoring (still off at run time until Config::performance_monitoring(true)).
performance = []
# A tracing Layer: breadcrumbs from tracing events, and database/HTTP spans for performance monitoring.
tracing = ["dep:tracing", "dep:tracing-subscriber"]
# capture_anyhow for anyhow::Error.
anyhow = ["dep:anyhow"]
# Trust the operating system's certificate store (and its private or corporate
# CAs) instead of the bundled Mozilla roots, through rustls-platform-verifier.
platform-verifier = ["ureq/platform-verifier"]

[dependencies]
flate2 = "1.0.30"
pin-project-lite = "0.2.14"
serde_json = "1.0.120"
ureq = { version = "3.0.12", default-features = false, features = ["rustls"] }
# Only to recognise ureq's TLS failures (rustls::Error inside an io::Error).
rustls = { version = "0.23", default-features = false, features = ["std"] }
anyhow = { version = "1.0.86", optional = true }
axum = { version = "0.8.1", default-features = false, features = ["matched-path"], optional = true }
http = { version = "1.1.0", optional = true }
tower-layer = { version = "0.3.3", optional = true }
tower-service = { version = "0.3.3", optional = true }
tracing = { version = "0.1.40", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["registry", "std"], optional = true }

[dev-dependencies]
axum = { version = "0.8.1", default-features = false, features = ["matched-path", "tokio", "http1", "query"] }
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tower = { version = "0.5.1", default-features = false, features = ["util"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["registry", "std", "fmt", "ansi"] }

[[example]]
name = "axum"
path = "examples/axum.rs"
required-features = ["axum", "performance", "tracing"]
